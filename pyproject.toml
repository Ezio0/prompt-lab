[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-lab"
version = "2.0.0"
description = "Local CLI prompt versioning and A/B testing"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "rich>=13.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
eval = [
    "deepeval>=2.0",
    "openai>=1.0",
]

[project.scripts]
prompt-lab = "prompt_lab.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["prompt_lab*", "web*"]
